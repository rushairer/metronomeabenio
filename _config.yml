title: Metronome
baseurl: /
permalink: '/:title/'
description: An ultra customizable generic theme for Stackbit
header:
  type: header
  template: header
  title: Metronome
  has_nav: false
  nav_links:
    - type: action
      template: action
      label: Features
      url: /features
      style: link
    - type: action
      template: action
      label: Blog
      url: /blog
      style: link
    - type: action
      template: action
      label: About
      url: /about
      style: link
    - type: action
      template: action
      label: Style Guide
      url: /style-guide
      style: link
    - type: action
      template: action
      label: Contact Us
      url: /contact
      style: primary
  logo: /images/marvelous-apple.png
footer:
  type: footer
  template: footer
  has_nav: false
  nav_links:
    - type: action
      template: action
      label: Contact Us
      url: /contact
      style: link
    - type: action
      template: action
      label: Privacy and Terms
      url: /terms
      style: link
  has_social: false
  social_links:
    - type: action
      template: action
      label: Twitter
      url: 'https://twitter.com/'
      style: link
      new_window: true
    - type: action
      template: action
      label: GitHub
      url: 'https://github.com/'
      style: link
      new_window: true
    - type: action
      template: action
      label: LinkedIn
      url: 'https://www.linkedin.com/'
      style: link
      new_window: true
  content: '&copy; Stackbit-Starter. All rights reserved.'
  links:
    - type: action
      template: action
      label: Made with Stackbit.
      url: 'https://www.stackbit.com'
      style: link
      new_window: true
sass:
  indentWidth: 4
  style: compressed
  precision: 10
plugins:
  - jekyll-menus
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - README.md
  - netlify.toml
  - stackbit-build.sh
  - stackbit-pull.js
collections:
  posts:
    permalink: '/posts/:title/'
