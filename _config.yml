title: Metronome
baseurl: /
permalink: '/:title/'
description: Metronome26 and Metronome Pro help musicians practice with precise tempo, expressive sounds, Apple Watch support, and sheet music workflows.
header:
  type: header
  template: header
  title: Metronome
  has_nav: true
  nav_links:
    - type: action
      template: action
      label: Metronome26
      url: /#metronome26
      style: link
    - type: action
      template: action
      label: Pro
      url: /#pro
      style: link
    - type: action
      template: action
      label: Compare
      url: /#compare
      style: link
    - type: action
      template: action
      label: Privacy
      url: /privacy-policy
      style: link
    - type: action
      template: action
      label: Download
      url: /#download
      style: primary
  logo: ''
footer:
  type: footer
  template: footer
  has_nav: true
  nav_links:
    - type: action
      template: action
      label: Metronome26
      url: https://apps.apple.com/us/app/metronome26-practice-beats/id6758878910
      style: link
      new_window: true
    - type: action
      template: action
      label: Metronome Pro
      url: https://apps.apple.com/us/app/metronome-metronome-pro/id1538268059
      style: link
      new_window: true
    - type: action
      template: action
      label: Privacy Policy
      url: /privacy-policy
      style: link
    - type: action
      template: action
      label: Terms of Service
      url: /terms
      style: link
  has_social: false
  social_links:
    - type: action
      template: action
      label: Twitter
      url: 'https://twitter.com/'
      style: link
      new_window: true
    - type: action
      template: action
      label: GitHub
      url: 'https://github.com/'
      style: link
      new_window: true
    - type: action
      template: action
      label: LinkedIn
      url: 'https://www.linkedin.com/'
      style: link
      new_window: true
  content: '&copy; aben.io. All rights reserved.'
  links: []
sass:
  indentWidth: 4
  style: compressed
  precision: 10
plugins:
  - jekyll-menus
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - README.md
  - netlify.toml
  - stackbit-build.sh
  - stackbit-pull.js
collections:
  posts:
    permalink: '/posts/:title/'
